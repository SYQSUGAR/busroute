name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: |
          python -m py_compile app.py transit_collector/project.py transit_collector/workflow.py transit_collector/gis.py transit_collector/exporter.py transit_collector/transbigdata_backend.py transit_collector/transbigdata_adapter.py transit_collector/transbigdata_v4.py transit_collector/ui/integrated_window.py transit_collector/ui/transbigdata_window.py transit_collector/ui/workbench_v4.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
