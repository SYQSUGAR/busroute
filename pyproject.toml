[project]
name = "amap-transit-collector"
version = "0.2.0"
description = "Desktop AMap transit collector with GeoPandas GIS export and station coverage analysis."
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "requests>=2.32,<3",
  "openpyxl>=3.1,<4",
  "keyring>=25,<26",
  "geopandas>=1.0,<2",
  "shapely>=2.0,<3",
  "pyproj>=3.6,<4",
  "pyogrio>=0.10,<1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
